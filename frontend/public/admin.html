<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Dashboard - Vithusan.V</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://thasvithu.github.io/admin.html">
  <link rel="icon" href="images/about.jpg">
  <link rel="stylesheet" href="css/style.css" type="text/css">
  <style>
    .admin-shell { max-width: 1200px; margin: 20px auto; padding: 20px; }
    .admin-card { background: #fdf9ff; border: 1px solid #d4d4e3; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .admin-card h3 { margin-bottom: 10px; }
    .btn { background-color: var(--skin-color); color: #fff; border: none; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .admin-card textarea, .admin-card input { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #d4d4e3; border-radius: 8px; }
    .admin-card select { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #d4d4e3; border-radius: 8px; background: #fff; }
    .admin-card textarea { min-height: 120px; }
    .admin-check { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; font-size: 14px; color: #302e4d; }
    .admin-check input { width: auto; margin: 0; }
    .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .admin-list-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; }
    .muted { color: #6a6a6a; font-size: 13px; }
    .hidden { display: none; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { width: 100%; max-width: 680px; max-height: 90vh; overflow: auto; background: #fff; border-radius: 12px; border: 1px solid #ddd; padding: 20px; }
    .modal-title { margin-bottom: 10px; }
    .image-preview { width: 100%; max-height: 200px; object-fit: contain; border: 1px solid #d4d4e3; border-radius: 8px; background: #fff; margin-bottom: 10px; display: none; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-shell">
    <h1>Admin Dashboard</h1>
    <p>Manage projects, blogs, and messages from one place.</p>

    <div class="admin-card" id="login-card">
      <h3>Admin Login</h3>
      <input id="api-base" placeholder="API base (default: http://localhost:4000/api)">
      <input id="admin-username" placeholder="Admin username">
      <input id="admin-password" type="password" placeholder="Admin password">
      <div class="admin-actions">
        <button class="btn" id="admin-login-btn">Login</button>
        <button class="btn" id="save-api-btn">Save API Base</button>
      </div>
      <p id="admin-auth-status"></p>
    </div>

    <div id="admin-app" class="hidden">
      <div class="admin-card">
        <h3>Session</h3>
        <div class="admin-actions">
          <button class="btn" id="refresh-admin-data-btn">Refresh Data</button>
          <button class="btn" id="admin-logout-btn">Logout</button>
        </div>
      </div>

      <div class="admin-grid">
        <div class="admin-card">
          <h3>Create Project</h3>
          <input id="p-title" placeholder="Title" required>
          <input id="p-subtitle" placeholder="Subtitle / one-line value proposition">
          <select id="p-category">
            <option value="">Select category</option>
            <option value="data-science">Data Science</option>
            <option value="machine-learning">Machine Learning</option>
            <option value="deep-learning">Deep Learning</option>
            <option value="nlp">NLP</option>
            <option value="generative-ai">Generative AI</option>
            <option value="rag">RAG</option>
            <option value="ai-agents">AI Agents</option>
            <option value="ai-ml">AI / ML</option>
          </select>
          <input id="p-role" placeholder="Your role (e.g. Full Stack Developer)">
          <input id="p-duration" placeholder="Duration (e.g. 3 months)">
          <input id="p-status" placeholder="Status (e.g. Completed)">
          <input id="p-technologies" placeholder="Technologies (comma separated)">
          <input id="p-image" placeholder="Auto-filled after upload (or paste image URL)" readonly>
          <img id="p-image-preview" class="image-preview" alt="Project thumbnail preview">
          <input id="p-tags" placeholder="Tags comma separated">
          <input id="p-github-url" placeholder="GitHub URL">
          <input id="p-demo-url" placeholder="Live demo URL">
          <input id="p-docs-url" placeholder="Docs / case study URL">
          <label class="admin-check"><input id="p-published" type="checkbox" checked> Published</label>
          <textarea id="p-summary" placeholder="Overview: problem, context, objective"></textarea>
          <textarea id="p-features" placeholder="Key features (use line breaks or bullets)"></textarea>
          <textarea id="p-implementation" placeholder="Implementation details: architecture, data flow, integrations"></textarea>
          <textarea id="p-challenges" placeholder="Challenges and constraints"></textarea>
          <textarea id="p-results" placeholder="Results with metrics (latency, accuracy, users, impact)"></textarea>
          <textarea id="p-future" placeholder="Future enhancements / roadmap"></textarea>
          <input id="p-image-file" type="file" accept="image/*">
          <div class="admin-actions">
            <button class="btn" id="upload-project-image-btn">Upload Image</button>
            <button class="btn" id="add-project-btn">Create Project</button>
          </div>
          <p id="project-status"></p>
        </div>

        <div class="admin-card">
          <h3>Create Blog</h3>
          <input id="b-title" placeholder="Title" required>
          <input id="b-date" placeholder="Date label (e.g. Feb 2026)">
          <input id="b-author-name" placeholder="Author name">
          <input id="b-author-bio" placeholder="Author short bio">
          <input id="b-image" placeholder="Auto-filled after upload (or paste image URL)" readonly>
          <img id="b-image-preview" class="image-preview" alt="Blog thumbnail preview">
          <input id="b-tags" placeholder="Tags comma separated">
          <label class="admin-check"><input id="b-published" type="checkbox" checked> Published</label>
          <textarea id="b-summary" placeholder="Summary"></textarea>
          <textarea id="b-content" placeholder="Content (plain text / markdown)"></textarea>
          <input id="b-image-file" type="file" accept="image/*">
          <div class="admin-actions">
            <button class="btn" id="upload-blog-image-btn">Upload Image</button>
            <button class="btn" id="add-blog-btn">Create Blog</button>
          </div>
          <p id="blog-status"></p>
        </div>
      </div>

      <div class="admin-grid">
        <div class="admin-card">
          <h3>Manage Projects</h3>
          <div id="projects-admin-list"></div>
        </div>
        <div class="admin-card">
          <h3>Manage Blogs</h3>
          <div id="blogs-admin-list"></div>
        </div>
      </div>

      <div class="admin-card">
        <h3>Contact Messages</h3>
        <button class="btn" id="load-messages-btn">Load Messages</button>
        <div id="admin-messages"></div>
      </div>

      <div class="admin-card">
        <h3>Audit Logs</h3>
        <button class="btn" id="load-audit-logs-btn">Load Audit Logs</button>
        <div id="admin-audit-logs"></div>
      </div>
    </div>
  </div>

  <div id="edit-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <h3 class="modal-title" id="edit-modal-title">Edit Item</h3>
      <input id="edit-title" placeholder="Title">
      <input id="edit-subtitle" placeholder="Subtitle (projects only)">
      <input id="edit-category" placeholder="Category (projects only)">
      <input id="edit-role" placeholder="Role (projects only)">
      <input id="edit-duration" placeholder="Duration (projects only)">
      <input id="edit-status" placeholder="Status (projects only)">
      <input id="edit-technologies" placeholder="Technologies (projects only)">
      <input id="edit-date-label" placeholder="Date label (blogs only)">
      <input id="edit-author-name" placeholder="Author name (blogs only)">
      <input id="edit-author-bio" placeholder="Author bio (blogs only)">
      <input id="edit-image-url" placeholder="Image URL/path">
      <input id="edit-tags" placeholder="Tags comma separated">
      <input id="edit-github-url" placeholder="GitHub URL (projects only)">
      <input id="edit-demo-url" placeholder="Live demo URL (projects only)">
      <input id="edit-docs-url" placeholder="Docs URL (projects only)">
      <label class="admin-check"><input id="edit-published" type="checkbox"> Published</label>
      <textarea id="edit-summary" placeholder="Summary / Overview"></textarea>
      <textarea id="edit-features" placeholder="Features (projects only)"></textarea>
      <textarea id="edit-implementation" placeholder="Implementation (projects only)"></textarea>
      <textarea id="edit-challenges" placeholder="Challenges (projects only)"></textarea>
      <textarea id="edit-results" placeholder="Results (projects only)"></textarea>
      <textarea id="edit-future" placeholder="Future enhancements (projects only)"></textarea>
      <textarea id="edit-content" placeholder="Content (blogs)"></textarea>
      <div class="admin-actions">
        <button class="btn" id="edit-save-btn">Save</button>
        <button class="btn" id="edit-cancel-btn">Cancel</button>
      </div>
      <p id="edit-status"></p>
    </div>
  </div>

  <script src="js/runtime-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
